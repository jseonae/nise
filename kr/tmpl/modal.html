<!--
  사용자 공통 모달 : [06] 모달 (#wrap 바깥)
  - 페이지의 <div data-include="modal"></div> 자리에 들어갑니다.
-->

<!-- ============================================================
     [06] 모달 : .modal-wrap (#wrap 바깥)
     ============================================================ -->
<div class="modal-wrap">
  <!-- [06-1] 글자·화면 표시 설정 : #modal_adjust_display (_common/resources/js/krds-display.js 연동, id·value 변경 금지) -->
  <section id="modal_adjust_display" class="krds-modal fade" aria-labelledby="tit_modal_adjust_display">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="tit_modal_adjust_display" class="modal-title">글자·화면 표시 설정</h2>
        </div>
        <div class="modal-conts">
          <div class="conts-area">
            <div class="adjust_display">
              <div class="fieldset adjust_scale">
                <div class="form-group scale-options">
                  <h3>글자·화면 표시 설정</h3>
                  <div class="form-conts">
                    <div class="krds-check-area chk-column">
                      <div class="krds-form-check">
                        <input type="radio" name="scale_level" id="scale_level_small" value="small">
                        <label for="scale_level_small">작게</label>
                      </div>
                      <div class="krds-form-check">
                        <input type="radio" name="scale_level" id="scale_level_medium" value="medium" checked>
                        <label for="scale_level_medium">보통</label>
                      </div>
                      <div class="krds-form-check">
                        <input type="radio" name="scale_level" id="scale_level_large" value="large">
                        <label for="scale_level_large">조금 크게</label>
                      </div>
                      <div class="krds-form-check">
                        <input type="radio" name="scale_level" id="scale_level_xlarge" value="xlarge">
                        <label for="scale_level_xlarge">크게</label>
                      </div>
                      <div class="krds-form-check">
                        <input type="radio" name="scale_level" id="scale_level_xxlarge" value="xxlarge">
                        <label for="scale_level_xxlarge">가장 크게</label>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="fieldset">
                <div class="form-group view-mode-options">
                  <h3>화면 표시 모드</h3>
                  <div class="form-conts">
                    <div class="krds-check-area chk-column">
                      <div class="krds-form-check view-mode-light">
                        <input type="radio" name="view_mode" id="view_mode_light" value="light" checked>
                        <label for="view_mode_light">기본 (밝은 배경)</label>
                      </div>
                      <div class="krds-form-check view-mode-dark">
                        <input type="radio" name="view_mode" id="view_mode_dark" value="high-contrast">
                        <label for="view_mode_dark">선명하게 (어두운 배경)</label>
                      </div>
                      <div class="krds-form-check view-mode-default">
                        <input type="radio" name="view_mode" id="view_mode_default" value="theme">
                        <label for="view_mode_default">시스템 설정</label>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-btn btn-wrap">
          <button type="button" class="krds-btn medium tertiary close-modal" id="reset_display">초기화</button>
          <button type="button" class="krds-btn medium primary close-modal">설정</button>
        </div>
        <button type="button" class="krds-btn medium icon btn-close close-modal">
          <span class="sr-only">닫기</span>
          <i class="svg-icon ico-popup-close"></i>
        </button>
      </div>
    </div>
    <div class="modal-back"></div>
  </section>
  <!-- //[06-1] 글자·화면 표시 설정 -->

  <!-- [06-2] 차트 확대 : #modal_chart_zoom (KRDS 모달, _common/resources/js/cm-chart.js 연동, id·class 변경 금지)
       그래프 도구의 [차트 확대] 버튼이 열고, 같은 그래프를 크게 다시 그림. 제목은 스크립트가 그래프 제목으로 바꿈 -->
  <section id="modal_chart_zoom" class="krds-modal fade cm-chart-modal" aria-labelledby="tit_modal_chart_zoom">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="tit_modal_chart_zoom" class="modal-title">차트 확대</h2>
        </div>
        <div class="modal-conts">
          <div class="conts-area">
            <div class="cm-chart-zoom-font" role="group" aria-label="그래프 글자 크기">
              <button type="button" class="krds-btn small tertiary" data-chart-font="down">글자 작게</button>
              <span class="cm-chart-zoom-level" aria-live="polite">100%</span>
              <button type="button" class="krds-btn small tertiary" data-chart-font="up">글자 크게</button>
            </div>
            <div class="cm-chart-zoom-body"></div>
          </div>
        </div>
        <button type="button" class="krds-btn medium icon btn-close close-modal">
          <span class="sr-only">닫기</span>
          <i class="svg-icon ico-popup-close"></i>
        </button>
      </div>
    </div>
    <div class="modal-back"></div>
  </section>
  <!-- //[06-2] 차트 확대 -->
  <!-- [06-3] 전체메뉴 팝업 : #modal_sitemap (신규 컴포넌트 _common/html/code/ext_sitemap_popup.html, Figma: 컨텐츠 > sitemap_popup)
       PC 헤더 유틸리티의 [전체메뉴] 버튼이 엶 (1024px 미만은 유틸리티가 숨겨져 모바일 전체메뉴 #mobile-nav 를 씀)
       KRDS 모달이라 열기 · 닫기 · Esc · 초점 가두기 · 배경 스크롤 잠금은 KRDS 스크립트가 맡고, 화면 전체로 띄우는 것만 CSS 로 보정 -->
  <section id="modal_sitemap" class="krds-modal fade cm-sitemap" aria-labelledby="tit_modal_sitemap">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="tit_modal_sitemap" class="modal-title sr-only">전체메뉴</h2>
        </div>
        <div class="modal-conts">
          <div class="conts-area cm-sitemap-inner">
            <!-- 로고 : 모드에 따라 바뀌도록 CSS 배경으로 넣음 (헤더 로고와 같은 방식) -->
            <p class="cm-sitemap-logo"><span class="sr-only">특수교육 실태조사 데이터 활용 플랫폼</span></p>
            <!-- 메뉴 : 1Depth 제목 + 2Depth 목록. kr/js/include.js 가 채움 (현재 화면 aria-current="page") -->
            <nav class="cm-sitemap-menu" aria-label="전체메뉴"></nav>
            <!-- 안내 링크 · 기관 정보 · 공식 SNS (이용안내 · 개인정보처리방침 · SNS 주소는 정해지면 연결) -->
            <div class="cm-sitemap-foot">
              <div class="info">
                <ul class="links">
                  <li><a href="#" class="krds-btn medium text">이용안내 <i class="svg-icon ico-angle right"></i></a></li>
                  <li><a href="#" class="krds-btn medium text">개인정보처리방침 <i class="svg-icon ico-angle right"></i></a></li>
                  <li><a href="https://www.mois.go.kr/frt/sub/popup/p_taegugki_banner/screen.do" class="krds-btn medium text" target="_blank" title="새 창 열림">국가상징 알아보기 <i class="svg-icon ico-go"></i></a></li>
                </ul>
                <ul class="addr">
                  <li>(31470) 충청남도 아산시 배방읍 공원로 40</li>
                  <li><strong>대표전화</strong> 041-537-1500</li>
                  <li><strong>팩스</strong> 041-531-6412</li>
                </ul>
              </div>
              <ul class="cm-sitemap-sns">
                <li><a href="#" target="_blank" title="새 창 열림"><img src="{{root}}_common/resources/img/sns/cm_sns_youtube.svg" alt="국립특수교육원 유튜브"></a></li>
                <li><a href="#" target="_blank" title="새 창 열림"><img src="{{root}}_common/resources/img/sns/cm_share_band.svg" alt="국립특수교육원 네이버 밴드"></a></li>
              </ul>
            </div>
          </div>
        </div>
        <button type="button" class="krds-btn large icon btn-close close-modal">
          <span class="sr-only">전체메뉴 닫기</span>
          <i class="svg-icon ico-popup-close"></i>
        </button>
      </div>
    </div>
    <div class="modal-back"></div>
  </section>
  <!-- //[06-3] 전체메뉴 팝업 -->
</div>
<!-- //[06] 모달 -->
