<!--
  사용자 공통 페이지 상단 : 브레드크럼 · 공유/인쇄 · 페이지 제목
  - 페이지의 <div data-include="page-top"></div> 자리에 들어갑니다. 제목·설명은 data-title · data-desc 로 바꿀 수 있습니다.
-->
<!-- 페이지 상단 : .cm-page-top (브레드크럼 · 공유/인쇄 · 페이지 제목)
     상세(view) 화면은 .cm-page-top-view 로 바뀌고 제목 영역이 빠집니다. 제목·설명·브레드크럼은 kr/js/include.js 가 채움 -->
<div class="cm-page-top">
  <div class="inner">
    <div class="cm-page-top-util">
      <nav class="krds-breadcrumb-wrap" aria-label="현재 경로" id="breadcrumb">
        <ol class="breadcrumb">
          <!-- 홈 > 1Depth > 2Depth : kr/js/include.js 가 채움 -->
        </ol>
      </nav>
      <div class="cm-btn-group">
        <!-- 공유하기 : KRDS 맥락적 도움말 변형 (_common/html/code/contextual_help--share.html) -->
        <div class="krds-contextual-help bottom left cm-share">
          <div class="tooltip-action">
            <button type="button" class="krds-btn xlarge icon border tooltip-btn">
              <span class="sr-only">공유하기</span>
              <i class="svg-icon ico-share"></i>
            </button>
            <div class="tooltip-popover" role="tooltip">
              <h2 class="tooltip-title">공유하기</h2>
              <ul class="tooltip-contents cm-share-list">
                <li><a href="#" class="cm-share-btn" data-share="facebook" target="_blank" title="새 창 열림"><img src="{{root}}_common/resources/img/sns/cm_share_facebook.svg" alt="페이스북에 공유하기"></a></li>
                <li><a href="#" class="cm-share-btn" data-share="x" target="_blank" title="새 창 열림"><img src="{{root}}_common/resources/img/sns/cm_share_x.svg" alt="X(트위터)에 공유하기"></a></li>
                <li><a href="#" class="cm-share-btn" data-share="band" target="_blank" title="새 창 열림"><img src="{{root}}_common/resources/img/sns/cm_share_band.svg" alt="네이버 밴드에 공유하기"></a></li>
                <li><a href="#" class="cm-share-btn" data-share="naver_blog" target="_blank" title="새 창 열림"><img src="{{root}}_common/resources/img/sns/cm_share_naver_blog.svg" alt="네이버 블로그에 공유하기"></a></li>
                <li><button type="button" class="cm-share-btn" data-share="url"><img src="{{root}}_common/resources/img/sns/cm_share_url.svg" alt="페이지 주소 복사하기"></button></li>
              </ul>
              <button type="button" class="krds-btn xsmall icon tooltip-close">
                <span class="sr-only">닫기</span>
                <i class="svg-icon ico-modal-close"></i>
              </button>
            </div>
          </div>
        </div>
        <button type="button" class="krds-btn xlarge icon border" onclick="window.print();">
          <span class="sr-only">인쇄하기</span>
          <i class="svg-icon ico-print"></i>
        </button>
      </div>
    </div>
    <div class="cm-page-title">
      <h1 class="h-tit"></h1>
      <p class="desc"></p>
    </div>
  </div>
</div>
<!-- //페이지 상단 -->
