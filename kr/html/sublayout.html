<!DOCTYPE html>
<html lang="ko" data-krds-mode="light">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="keywords" content="">
  <meta name="description" content="">
  <meta name="format-detection" content="telephone=no">
  <title>서브 레이아웃 | 사용자</title>

  <!-- 파비콘 (KRDS 1.1.0) -->
  <link rel="icon" type="image/svg+xml" href="../../krds/resources/img/component/favicon/favicon.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="../../krds/resources/img/component/favicon/favicon-512x512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../../krds/resources/img/component/favicon/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../../krds/resources/img/component/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" href="../../krds/resources/img/component/favicon/favicon-192x192.png">

  <!-- css : KRDS (원본, 수정 금지) -->
  <!-- output.css = common.css + component.css 통합본. component.css는 일부 이미지 경로(img/img/...)가 잘못되어 있어 샘플과 같이 output.css를 사용합니다. -->
  <link rel="stylesheet" href="../../krds/resources/css/plugin/swiper-bundle.min.css">
  <link rel="stylesheet" href="../../krds/resources/css/component/output.css">
  <!-- css : 커스텀 (PretendardGOV 폰트 @font-face 포함) -->
  <link rel="stylesheet" href="../../_common/resources/css/krds-base.css"><!-- KRDS 기본 보정 -->
  <link rel="stylesheet" href="../../_common/resources/css/krds-custom.css">
  <link rel="stylesheet" href="../css/krds-theme.css">
  <link rel="stylesheet" href="../css/user-custom.css">

  <!-- script : 글자·화면 표시 설정 (화면 깜빡임 방지를 위해 head에서 불러옴) -->
  <script src="../../_common/resources/js/krds-display.js"></script>
</head>

<body>
  <!--
    ==================================================================
    서브 레이아웃 인덱스 (KRDS 샘플 sample_sub_01 기준, 이 사업은 사이드메뉴 없는 1단형)
    새 페이지는 이 파일을 복사해 [04-1] 컨텐츠만 채웁니다.
    ==================================================================
    [S] #wrap                          전체 레이아웃 래퍼
      [01] 본문 바로가기               #krds-skip-link          ┐
      [02] 공식 누리집 배너            #krds-masthead           ├ kr/tmpl/header.html
      [03] 헤더                        #krds-header             ┘  (메인메뉴 2Depth 는 kr/js/include.js 메뉴 데이터로 채움)
      [04] 컨테이너                    #container               → 페이지별
        페이지 상단                    .cm-page-top             → kr/tmpl/page-top.html (브레드크럼 · 공유/인쇄 · 제목)
        [04-1] 컨텐츠                  .inner.cm-contents       → 페이지별 컨텐츠 (이 부분만 작성)
      [05] 푸터 · TOP 버튼             #krds-footer             → kr/tmpl/footer.html
    [E] #wrap
    [06] 모달                          .modal-wrap (#wrap 바깥) → kr/tmpl/modal.html
    [07] 스크립트                                               → 페이지별 (include.js 를 KRDS 스크립트보다 먼저)

    인클루드 : <div data-include="이름"></div> 를 kr/js/include.js 가 kr/tmpl/이름.html 로 바꿈
               (로컬 서버에서 열어야 동작, 개발 연동 시 서버 인클루드로 대체)
    현재 메뉴 : 파일 위치(kr/html/1Depth폴더/파일명)로 메뉴 데이터에서 찾아 메인메뉴·브레드크럼·제목에 표시
               xxx_view.html 은 상세 화면으로 보고 페이지 제목 없이 표시
    ==================================================================
  -->

  <!-- [S] #wrap -->
  <div id="wrap">
    <!-- [01]~[03] 본문 바로가기 · 공식 누리집 배너 · 헤더 -->
    <div data-include="header"></div>

    <!-- ============================================================
         [04] 컨테이너 : #container
         ============================================================ -->
    <div id="container">
      <!-- 페이지 상단 : 브레드크럼 · 공유/인쇄 · 페이지 제목 (메뉴에 없는 페이지는 data-title · data-desc 로 지정) -->
      <div data-include="page-top" data-title="페이지 제목" data-desc="페이지 설명"></div>

      <!-- [04-1] 컨텐츠 : .inner -->
      <div class="inner cm-contents">
        컨텐츠 영역
      </div>
      <!-- //[04-1] 컨텐츠 -->
    </div>
    <!-- //[04] 컨테이너 -->

    <!-- [05] 푸터 · TOP 버튼 -->
    <div data-include="footer"></div>
  </div>
  <!-- [E] #wrap -->

  <!-- [06] 모달 (#wrap 바깥) -->
  <div data-include="modal"></div>

  <!-- ============================================================
       [07] 스크립트 (include.js 를 KRDS 스크립트보다 먼저)
       ============================================================ -->
  <script src="../js/include.js"></script><!-- 공통 영역 인클루드 : KRDS 스크립트보다 먼저 -->
  <script src="../../krds/resources/js/plugin/swiper-bundle.min.js"></script>
  <script src="../../krds/resources/js/component/ui-script.js"></script>
  <script src="../../_common/resources/js/krds-custom.js"></script><!-- KRDS 스크립트 보정 -->
  <script src="../../_common/resources/js/krds-base.js"></script><!-- KRDS 기본 보정 (TOP 버튼 등) -->
  <script src="../js/user-custom.js"></script>
  <!-- //[07] 스크립트 -->
</body>
</html>
