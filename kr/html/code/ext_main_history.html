<!-- ext: 신규 컴포넌트 (KRDS에 없음, 메인 전용) / 실태조사변천사 : 겹친 카드 넘김 + 연도 진행 막대 -->
<!--
  Figma : 컨텐츠 > 변천사3 Default ~ Variant7 (node 11510:64693 ~ 64699)
  - 스타일 : kr/css/main.css 3-3. 실태조사변천사 (.cm-history) / 스크립트 : kr/js/main.js cmMainHistory
  - 카드는 한 장만 보입니다. 이전 · 다음 버튼, 연도 버튼(방향키 가능)으로 넘기고 자동 넘김은 없습니다.
  - 바뀐 카드는 aria-live 로 알리고, 현재 연도 버튼에 aria-current 를 둡니다.
  - 연도 숫자 글꼴 Bebas Neue 는 KRDS 글꼴이 아닙니다. (_common/resources/font/BebasNeue-Regular.woff2)
  - 머리말 글꼴(Figma : Ria Sans)은 넣지 않고 기본 글꼴로 대체했습니다.
  - 머리말 윗줄 색은 Figma(불투명도 40%)가 대비 기준에 못 미쳐 4.5:1 이 되는 색으로 보정했습니다.
-->
<div class="cm-history" data-cm-history role="group" aria-roledescription="캐러셀" aria-label="실태조사변천사">
  <div class="cm-history-stage">
    <span class="layer layer3" aria-hidden="true"></span>
    <span class="layer layer2" aria-hidden="true"></span>
    <span class="layer layer1" aria-hidden="true"></span>
    <ul class="cm-history-slides" aria-live="polite">
      <li class="cm-history-slide is-active" id="history_slide_1" role="group" aria-roledescription="슬라이드" aria-label="7장 중 1번째, 2008년">
        <div class="top">
          <div class="head">
            <p class="eyebrow"><span class="sub">변화하는 교육 현장을 담아온</span> <span class="main">특수교육 실태조사의 기록</span></p>
            <span class="idx" aria-hidden="true">1</span>
          </div>
          <div class="body">
            <h3 class="tit"><span class="sr-only">2008년 : </span>특수교육 실태조사의 시작</h3>
            <ul class="cm-check-list">
              <li>장애인 등에 대한 특수교육법 시행 후 <br class="pc-only"><em>최초로 실시된 조사</em></li>
              <li>법적 8개 조사 부문 중 6개 영역 조사 실시</li>
            </ul>
          </div>
        </div>
        <div class="side">
          <p class="year" aria-hidden="true">2008</p>
          <a href="stat/survey_history_list.html?round=1" class="krds-btn medium tertiary">자세히보기<span class="sr-only"> : 2008년 제1차 조사 변천사</span> <i class="svg-icon ico-angle right" aria-hidden="true"></i></a>
        </div>
        <div class="cover"><img src="{{root}}kr/img/main/history_cover_2008.jpg" alt="2008 특수교육 실태조사 보고서 표지" width="255" height="346"></div>
      </li>
      <!-- 2 ~ 7번째 카드 : 같은 구조, 보이지 않는 카드는 hidden -->
    </ul>
  </div>
  <div class="cm-history-nav">
    <!-- 연도 진행 막대 : 연도를 누르면 해당 카드로 이동, 현재 연도 aria-current -->
    <ol class="cm-history-timeline" aria-label="조사 연도">
      <li class="is-active"><button type="button" data-index="0" aria-controls="history_slide_1" aria-current="true"><span class="year">2008</span><span class="label">최초조사</span></button></li>
      <li><button type="button" data-index="1" aria-controls="history_slide_2"><span class="year">2011</span><span class="label">온라인조사 도입</span></button></li>
      <li><button type="button" data-index="2" aria-controls="history_slide_3"><span class="year">2014</span><span class="label">조사대상 확대</span></button></li>
      <li><button type="button" data-index="3" aria-controls="history_slide_4"><span class="year">2017</span><span class="label">TAPI도입</span></button></li>
      <li><button type="button" data-index="4" aria-controls="history_slide_5"><span class="year">2020</span><span class="label">비대면조사도입</span></button></li>
      <li><button type="button" data-index="5" aria-controls="history_slide_6"><span class="year">2023</span><span class="label">조사체계고도화</span></button></li>
      <li><button type="button" data-index="6" aria-controls="history_slide_7"><span class="year">2026</span><span class="label">현재조사</span></button></li>
    </ol>
    <div class="cm-history-arrows">
      <button type="button" class="cm-round-btn prev"><span class="sr-only">이전 조사</span><i class="svg-icon ico-angle left" aria-hidden="true"></i></button>
      <button type="button" class="cm-round-btn next"><span class="sr-only">다음 조사</span><i class="svg-icon ico-angle right" aria-hidden="true"></i></button>
    </div>
  </div>
</div>
