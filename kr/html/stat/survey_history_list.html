<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <!-- 파비콘 (KRDS 1.1.0) -->
  <link rel="icon" type="image/svg+xml" href="../../../krds/resources/img/component/favicon/favicon.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="../../../krds/resources/img/component/favicon/favicon-512x512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../../../krds/resources/img/component/favicon/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../../../krds/resources/img/component/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" href="../../../krds/resources/img/component/favicon/favicon-192x192.png">

  <!-- css : KRDS (원본, 수정 금지) -->
  <link rel="stylesheet" href="../../../krds/resources/css/plugin/swiper-bundle.min.css">
  <link rel="stylesheet" href="../../../krds/resources/css/component/output.css">
  <!-- css : 커스텀 -->
  <link rel="stylesheet" href="../../../_common/resources/css/krds-base.css"><!-- KRDS 기본 보정 -->
  <link rel="stylesheet" href="../../../_common/resources/css/krds-custom.css">
  <link rel="stylesheet" href="../../css/krds-theme.css">
  <link rel="stylesheet" href="../../css/user-custom.css">

  <!-- script : 글자·화면 표시 설정 (화면 깜빡임 방지를 위해 head에서 불러옴) -->
  <script src="../../../_common/resources/js/krds-display.js"></script>
</head>

<body>
  <!--
    ==================================================================
    조사 변천사 목록 (Figma: 컨텐츠 > s01통계정보_조사 변천사 list, node 10498:43777)
    공통 영역은 kr/tmpl 에서 인클루드합니다 (kr/js/include.js). 이 파일에는 페이지 컨텐츠만 둡니다.
      [01]~[03] 헤더             : kr/tmpl/header.html
      페이지 상단(브레드크럼·제목) : kr/tmpl/page-top.html (제목·설명은 메뉴 데이터, data-title · data-desc 로 변경 가능)
      [05] 푸터 · TOP 버튼        : kr/tmpl/footer.html
      [06] 모달                   : kr/tmpl/modal.html
    ==================================================================
  -->

  <!-- [S] #wrap -->
  <div id="wrap">
    <!-- [01]~[03] 본문 바로가기 · 공식 누리집 배너 · 헤더 -->
    <div data-include="header"></div>

    <!-- ============================================================
         [04] 컨테이너 : #container
         ============================================================ -->
    <div id="container">
      <!-- 페이지 상단 : 브레드크럼 · 공유/인쇄 · 페이지 제목 -->
      <div data-include="page-top"></div>

      <!-- [04-1] 컨텐츠 : .inner (Figma: 컨텐츠 > s01통계정보_조사 변천사 list)
           차수 탭 · 개요 · 조사대상자 카드는 데이터로 그립니다. (kr/js/survey-history.js)
             데이터 : kr/data/survey_history/index.json  ←  엑셀 _data/survey_history.xlsx 를 고친 뒤
                      python3 _tools/build_survey_history.py 로 다시 만듦
             마크업 견본 : 아래 주석(탭 1개 · 패널 1개). 스크립트가 같은 구조로 차수만큼 만듭니다.
           개발 연동 시에는 서버 출력으로 바꾸고 스크립트는 쓰지 않습니다. -->
      <div class="inner cm-contents cm-survey-history" data-survey-history="list">
        <!-- 조사 차수 탭 : KRDS 탭(fill full) + 가로 스크롤 변형 (_common/html/code/tab--scroll.html)
             "선택됨" 대체 텍스트는 KRDS 스크립트(krds_tab)가 넣습니다. -->
        <div class="krds-tab-area layer cm-tab-scroll">
          <div class="tab fill full">
            <ul role="tablist">
              <!-- 탭 견본 (예정 차수는 button 에 disabled, .sub 는 "예정")
              <li id="tab_history_06" role="tab" aria-selected="true" aria-controls="panel_history_06" class="active">
                <button type="button" class="btn-tab">2023년 <span class="sub">제6차</span></button>
              </li>
              -->
            </ul>
            <div class="cm-tab-scroll-nav prev" hidden>
              <button type="button" class="cm-tab-scroll-btn"><span class="sr-only">이전 차수 보기</span><i class="svg-icon ico-angle left" aria-hidden="true"></i></button>
            </div>
            <div class="cm-tab-scroll-nav next" hidden>
              <button type="button" class="cm-tab-scroll-btn"><span class="sr-only">다음 차수 보기</span><i class="svg-icon ico-angle right" aria-hidden="true"></i></button>
            </div>
          </div>

          <div class="tab-conts-wrap">
            <!-- 패널 견본
            <section id="panel_history_06" aria-labelledby="tab_history_06" class="tab-conts active" data-quick-nav="false">
              <div class="cm-history-summary">
                <h2 class="cm-history-tit">제6차(2023년) 특수교육 실태조사</h2>
                <dl class="cm-history-meta">
                  <dt>조사 문항</dt>
                  <dd>조사 대상자 8개·영역 50개·총 421문항</dd>
                </dl>
                <p class="cm-history-note">※ 안내 문구 (있을 때만)</p>
                <div class="cm-history-part">
                  <p class="tit">조사 부분 <span class="num">7</span>개</p>
                  <ul class="cm-dot-list">
                    <li>특수교육대상자 현황</li>
                  </ul>
                </div>
              </div>
              <div class="cm-survey-group">
                <h3 class="cm-survey-group-tit">보호자용 면접 조사 문항 <span class="krds-badge bg-light-information">2종</span></h3>
                <ul class="cm-survey-cards">
                  <li class="cm-survey-card">
                    <h4 class="tit"><a href="survey_history_view.html?id=601"><span class="txt">특수교육대상자 보호자</span><i class="svg-icon ico-angle right" aria-hidden="true"></i></a></h4>
                    <dl class="cm-survey-stat">
                      <div class="item"><dt class="sr-only">문항 수</dt><dd><strong class="num">105</strong> 문항</dd></div>
                      <div class="area"><dt>영역</dt><dd><strong>5</strong>개</dd></div>
                    </dl>
                    <ul class="krds-tag-wrap medium cm-survey-tags" aria-label="영역별 문항 수">
                      <li><span class="krds-btn-tag">일반사항 <span class="num">3</span><span class="sr-only">문항</span></span></li>
                    </ul>
                  </li>
                </ul>
              </div>
            </section>
            예정 차수 패널 : <h2 class="cm-history-tit">제7차(2026년) 특수교육 실태조사</h2><p class="cm-history-ready">조사 결과를 준비하고 있습니다.</p>
            -->
            <noscript><p class="cm-history-ready">이 화면은 스크립트를 켜야 조사 변천사 내용을 볼 수 있습니다.</p></noscript>
          </div>
        </div>
        <!-- 만족도조사 : 모든 콘텐츠 맨 아래 공통 (kr/tmpl/research.html) -->
        <div data-include="research"></div>
      </div>
      <!-- //[04-1] 컨텐츠 -->
    </div>
    <!-- //[04] 컨테이너 -->

    <!-- [05] 푸터 · TOP 버튼 -->
    <div data-include="footer"></div>
  </div>
  <!-- [E] #wrap -->

  <!-- [06] 모달 (#wrap 바깥) -->
  <div data-include="modal"></div>

  <!-- ============================================================
       [07] 스크립트
       ============================================================ -->
  <script src="../../js/include.js"></script><!-- 공통 영역 인클루드 : KRDS 스크립트보다 먼저 -->
  <script src="../../js/survey-history.js"></script><!-- 조사 변천사 데이터 그리기 : 인클루드 다음, KRDS 스크립트보다 먼저 -->
  <script src="../../../krds/resources/js/plugin/swiper-bundle.min.js"></script>
  <script src="../../../krds/resources/js/component/ui-script.js"></script>
  <script src="../../../_common/resources/js/krds-custom.js"></script>
  <script src="../../../_common/resources/js/krds-base.js"></script>
  <script src="../../js/user-custom.js"></script>
  <!-- //[07] 스크립트 -->
</body>
</html>
