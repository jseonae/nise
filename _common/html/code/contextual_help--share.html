<!-- base: krds/html/code/contextual_help.html (1.0.6) / 변경: 도움말 아이콘 버튼 → 테두리형 공유 버튼, 내용 → SNS 공유 버튼 목록(.cm-share-list), 제목 h2 -->
<!-- 공유하기 (Figma: 컨텐츠 > share-modal) : 스타일 _common/resources/css/krds-custom.css, 동작 kr/js/user-custom.js -->
<div class="krds-contextual-help bottom left cm-share">
	<div class="tooltip-action">
		<button type="button" class="krds-btn xlarge icon border tooltip-btn">
			<span class="sr-only">공유하기</span>
			<i class="svg-icon ico-share"></i>
		</button>
		<div class="tooltip-popover" role="tooltip">
			<h2 class="tooltip-title">공유하기</h2>
			<ul class="tooltip-contents cm-share-list">
				<li><a href="#" class="cm-share-btn" data-share="facebook" target="_blank" title="새 창 열림"><img src="../resources/img/sns/cm_share_facebook.svg" alt="페이스북에 공유하기"></a></li>
				<li><a href="#" class="cm-share-btn" data-share="x" target="_blank" title="새 창 열림"><img src="../resources/img/sns/cm_share_x.svg" alt="X(트위터)에 공유하기"></a></li>
				<li><a href="#" class="cm-share-btn" data-share="band" target="_blank" title="새 창 열림"><img src="../resources/img/sns/cm_share_band.svg" alt="네이버 밴드에 공유하기"></a></li>
				<li><a href="#" class="cm-share-btn" data-share="naver_blog" target="_blank" title="새 창 열림"><img src="../resources/img/sns/cm_share_naver_blog.svg" alt="네이버 블로그에 공유하기"></a></li>
				<li><button type="button" class="cm-share-btn" data-share="url"><img src="../resources/img/sns/cm_share_url.svg" alt="페이지 주소 복사하기"></button></li>
			</ul>
			<button type="button" class="krds-btn xsmall icon tooltip-close">
				<span class="sr-only">닫기</span>
				<i class="svg-icon ico-modal-close"></i>
			</button>
		</div>
	</div>
</div>
