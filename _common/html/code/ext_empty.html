<!-- ext: 신규 컴포넌트 (KRDS에 없음) / 빈 상태 · 준비 중 안내 : 그림 + 제목 + 설명 -->
<!--
  Figma : 컨텐츠 > s02데이터분석_교차분석 페이지준비중
  - 스타일 : _common/resources/css/krds-custom.css [공통] 빈 상태 · 준비 중 안내 (.cm-empty)
  - 그림은 꾸밈용이라 alt="" (그림 투명도 55%는 Figma 그대로)
  - 제목 수준(h2·h3)은 놓이는 자리에 맞게 바꿉니다.
-->
<div class="cm-empty">
  <img src="{{root}}_common/resources/img/common/cm_ready.png" alt="">
  <h2 class="tit">준비중입니다.</h2>
  <p class="txt">현재 화면은 준비 중입니다.</p>
</div>

<!-- 변형 : 오류 안내 (.cm-empty.is-error)
     Figma : 컨텐츠 > s03알림마당_자료실 list-목록불러오기 실패 > errorBox
     - 그림 없이 문구 + 버튼(KRDS large tertiary). 목록 조회에 실패했을 때 목록 · 페이지네이션 자리에 넣습니다.
     - 화면이 바뀌며 나타나는 안내라 role="alert" 로 스크린리더에 알립니다. -->
<div class="cm-empty is-error" role="alert">
  <p class="tit">목록을 불러오지 못했습니다.</p>
  <p class="txt">잠시 후 다시 시도해 주세요.</p>
  <button type="button" class="krds-btn large tertiary">다시시도</button>
</div>
