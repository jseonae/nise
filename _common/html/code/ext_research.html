<!-- ext: 신규 컴포넌트 (KRDS 만족도 조사는 Figma 가이드만 있고 코드 없음) / 만족도조사 : 5단계 라디오 + 의견 입력 + 평가하기 -->
<!-- 사용자단은 kr/tmpl/research.html 로 인클루드합니다 (모든 콘텐츠 페이지 .cm-contents 맨 끝). -->
<!-- 만족도조사 : 개발 시 action 에 저장 주소 연결 -->
<section class="cm-research" aria-labelledby="cm_research_tit">
  <form class="cm-research-form" action="#" method="post">
    <div class="cm-research-top">
      <h2 id="cm_research_tit" class="tit"><i class="svg-icon cm-ico-inquiry" aria-hidden="true"></i>현재 페이지의 내용이나 사용 편의성에 만족하십니까?</h2>
      <!-- 만족도 5단계 : KRDS 라디오, 질문(제목)을 그룹 이름으로 연결 -->
      <div class="krds-check-area cm-research-rate" role="radiogroup" aria-labelledby="cm_research_tit">
        <div class="krds-form-check medium">
          <input type="radio" name="research_rate" id="research_rate_5" value="5">
          <label for="research_rate_5">매우만족</label>
        </div>
        <div class="krds-form-check medium">
          <input type="radio" name="research_rate" id="research_rate_4" value="4">
          <label for="research_rate_4">만족</label>
        </div>
        <div class="krds-form-check medium">
          <input type="radio" name="research_rate" id="research_rate_3" value="3">
          <label for="research_rate_3">보통</label>
        </div>
        <div class="krds-form-check medium">
          <input type="radio" name="research_rate" id="research_rate_2" value="2">
          <label for="research_rate_2">불만족</label>
        </div>
        <div class="krds-form-check medium">
          <input type="radio" name="research_rate" id="research_rate_1" value="1">
          <label for="research_rate_1">매우불만족</label>
        </div>
      </div>
    </div>
    <div class="cm-research-opinion">
      <div class="input">
        <label for="research_opinion" class="sr-only">의견 (200자 이내)</label>
        <input type="text" id="research_opinion" name="research_opinion" class="krds-input medium" placeholder="의견을 남겨주세요." maxlength="200" aria-describedby="research_hint research_count">
        <!-- 입력창 아래 : 도움말(KRDS form-hint, 입력을 시작해도 남는 안내) + 글자 수(KRDS textarea-count). 둘 다 aria-describedby 로 입력창에 연결 -->
        <div class="cm-research-hint">
          <p class="form-hint" id="research_hint">이 페이지 이용 중 불편한 점이나 개선이 필요한 사항에 대한 의견을 남겨주시면 적극 반영하겠습니다.</p>
          <p class="textarea-count" id="research_count"><span class="count-now">0</span><span class="count-total">/200자 이내</span></p>
        </div>
      </div>
      <button type="button" class="krds-btn medium cm-research-submit">평가하기</button>
      <!-- [개발 메모] 퍼블리싱에서는 누르면 오류 페이지로 넘어가지 않게 type="button" 으로 두었습니다.
           개발 시 type="submit" 으로 바꾸고 form 의 action 에 만족도조사 저장 주소를 연결해 주세요.
           의견 입력창에서 Enter 를 눌러도 제출되지 않게 막아 둔 확인용 코드(_common/resources/js/krds-custom.js cmResearch 의 submit 막기)도 함께 지워 주세요. -->
    </div>
  </form>
</section>
